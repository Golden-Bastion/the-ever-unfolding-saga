title: "The Ever-Unfolding Saga"
description: "A graphics-first, character-centred dark fantasy RPG about exploration, relationships, and adventures in a persistent world."
url: "https://golden-bastion.github.io"
baseurl: "/the-ever-unfolding-saga"
lang: "en"
markdown: kramdown
permalink: /blog/:year/:month/:day/:title/

remote_theme: b2a3e8/jekyll-theme-console
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-feed
header_pages:
  - index.html
  - game.md
  - blog.md
style: dark
listen_for_clients_preferred_style: true
disable_google_fonts: true
footer: '© Golden Bastion · <a href="https://github.com/Golden-Bastion">GitHub</a> · <a href="https://golden-bastion.github.io/the-ever-unfolding-saga/feed.xml">Atom feed</a>'

feed:
  posts_limit: 20

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
