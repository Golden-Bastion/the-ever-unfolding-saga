[package]
name = "ever_unfolding_saga"

version = "0.52.66"
edition = "2021"
license = "BUSL-1.1"
# ---- related to license, `data/` is under CC-BY-NC-ND 4.0 ----
authors = ["right-ward"]
repository = "https://github.com/Golden-Bastion/the-ever-unfolding-saga"
description = "character-focused dark-fantasy RPG about self-directed adventures"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[example]]
name = "spatial_3d_prototype"
path = "examples/spatial_3d_prototype.rs"
required-features = ["spatial-3d-prototype"]

[dependencies]
bevy = { version = "0.20.0", default-features = false, features = [
    "default_app",
    "2d_bevy_render",
    "ui_bevy_render",
    "std",
    "default_font",
    "bevy_winit",
    "x11",
    "android-game-activity",
    "bevy_ui_widgets",
    "ui_picking",
    "png",
    "keyboard",
    "mouse",
    "touch",
] }
bevy_picking = { version = "0.20.0", default-features = false }
dirs = "6"
atomic-write-file = "0.3.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1.1"

[target.'cfg(not(target_os = "android"))'.dependencies]
png = "0.18.1"
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
winit = "0.30.13"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.4"

[features]
dev = ["bevy/dynamic_linking"]
spatial-3d-prototype = ["bevy/bevy_pbr"]
spatial-3d-no-shadows = ["spatial-3d-prototype"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 10
lto = true
opt-level = "s"
strip = true

[profile.test]
codegen-units = 256
opt-level = 1
debug = "line-tables-only"
