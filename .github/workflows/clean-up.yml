name: Cleanup workflow runs

on:
  workflow_run:
    workflows:
      - CI/CD
    types:
      - completed

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Prune previous workflow runs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out cleanup script
        uses: actions/checkout@v7.0.1
        with:
          ref: main

      - name: Clean up previous workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.event.workflow_run.id }}
          TRIGGER_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          TRIGGER_EVENT: ${{ github.event.workflow_run.event }}
          TRIGGER_BRANCH: ${{ github.event.workflow_run.head_branch }}
        shell: bash
        run: bash .github/scripts/cleanup-workflow-runs.sh
