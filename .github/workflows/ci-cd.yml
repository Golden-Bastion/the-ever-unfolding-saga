name: CI/CD

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
    paths:
      - '**.rs'
      - '.github/workflows/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'data/**'
  workflow_dispatch:
    inputs:
      operation:
        description: Operation to perform
        required: true
        default: build
        type: choice
        options:
          - build
          - release
          - publish
      branch:
        description: Branch to build from (build operation only)
        required: false
        default: main
        type: string
      target:
        description: Platform and architecture to build (build operation only)
        required: false
        default: linux-x86_64
        type: choice
        options:
          - linux-x86_64
          - linux-aarch64
          - macos-aarch64
          - windows-x86_64
          - windows-aarch64
      release_tag:
        description: Existing release tag to rebuild (release) or publish existing artifacts (publish)
        required: false
        type: string
      publish_to:
        description: Destination for existing artifacts (publish operation only)
        required: true
        default: both
        type: choice
        options:
          - github
          - itch
          - both
      debug_build:
        description: Enable Bevy ECS debug names in the release binary (build operation only)
        required: false
        default: false
        type: boolean
      version_suffix:
        description: Display-only suffix appended after the package version
        required: false
        default: ''
        type: string

concurrency:
  group: cd-${{ github.ref }}-${{ inputs.operation }}-${{ inputs.branch }}-${{ inputs.target }}-${{ inputs.release_tag }}-${{ inputs.publish_to }}-${{ inputs.version_suffix }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  clippy:
    name: Clippy
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'build'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: stable
          cache: true

      - name: Run Clippy
        shell: bash
        run: |
          set +e

          cargo clippy --all-targets --all-features -- -D warnings
          clippy_status=${PIPESTATUS[0]}

          echo "clippy_status=$clippy_status"
          if [ "$clippy_status" -ne 0 ]; then
            exit 1
          fi

  test:
    name: Test
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'build'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: stable
          cache: true

      - name: Run formatting and tests
        shell: bash
        run: |
          set +e

          echo '=== cargo fmt --check ==='
          cargo fmt --all -- --check
          fmt_status=$?

          echo '=== cargo test ==='
          cargo_features=(--features dev)
          cargo test "${cargo_features[@]}" --no-fail-fast
          test_status=$?

          echo "fmt_status=$fmt_status"
          echo "test_status=$test_status"

          if [ "$fmt_status" -ne 0 ] || [ "$test_status" -ne 0 ]; then
            echo "fmt_status=$fmt_status"
            echo "test_status=$test_status"
            exit 1
          fi

  prep_build_matrix:
    name: Prepare build matrix
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.operation != 'publish')
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      ref: ${{ steps.matrix.outputs.ref }}

    steps:
      - name: Prepare build matrix
        id: matrix
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
          OPERATION: ${{ inputs.operation }}
          BRANCH: ${{ inputs.branch }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          matrix='[
            {"platform":"linux","arch":"x86_64","dispatch_target":"linux-x86_64","target":"x86_64-unknown-linux-gnu","runner":"ubuntu-latest","archive_ext":"tar.xz"},
            {"platform":"linux","arch":"aarch64","dispatch_target":"linux-aarch64","target":"aarch64-unknown-linux-gnu","runner":"ubuntu-latest","archive_ext":"tar.xz"},
            {"platform":"macos","arch":"aarch64","dispatch_target":"macos-aarch64","target":"aarch64-apple-darwin","runner":"macos-15","archive_ext":"tar.xz"},
            {"platform":"windows","arch":"x86_64","dispatch_target":"windows-x86_64","target":"x86_64-pc-windows-msvc","runner":"windows-latest","archive_ext":"zip"},
            {"platform":"windows","arch":"aarch64","dispatch_target":"windows-aarch64","target":"aarch64-pc-windows-msvc","runner":"windows-latest","archive_ext":"zip"}
          ]'

          source_ref="$GITHUB_REF_NAME"

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$OPERATION" == "release" ]]; then
              if [[ -z "$RELEASE_TAG" ]]; then
                echo "release_tag is required for the release operation."
                exit 1
              fi
              case "$RELEASE_TAG" in
                v[0-9]*.[0-9]*.[0-9]*) ;;
                *)
                  echo "Release tags must use vMAJOR.MINOR.PATCH; got $RELEASE_TAG"
                  exit 1
                  ;;
              esac
              source_ref="$RELEASE_TAG"
            else
              if [[ -z "$BRANCH" ]]; then
                echo "branch is required for the build operation."
                exit 1
              fi
              matrix="$(jq -c --arg target "$TARGET" 'map(select(.dispatch_target == $target))' <<< "$matrix")"
              if [[ "$matrix" == "[]" ]]; then
                echo "Unsupported build target: $TARGET"
                exit 1
              fi
              source_ref="$BRANCH"
            fi
          fi

          matrix="$(jq -c . <<< "$matrix")"
          echo "ref=$source_ref" >> "$GITHUB_OUTPUT"
          echo "matrix={\"include\":$matrix}" >> "$GITHUB_OUTPUT"

  prepare_release:
    name: Prepare draft GitHub Release
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.operation == 'release')
    needs: prep_build_matrix
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout release source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prep_build_matrix.outputs.ref }}
          fetch-depth: 0

      - name: Validate release tag and package version
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prep_build_matrix.outputs.ref }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH; got $RELEASE_TAG"
            exit 1
          fi
          tag_commit="$(git rev-list -n 1 "$RELEASE_TAG^{commit}")"
          if ! git branch -r --contains "$tag_commit" | grep -qE 'origin/main$'; then
            echo "Tag $RELEASE_TAG does not point to a commit contained in main."
            exit 1
          fi
          package_version="$(grep '^version = ' Cargo.toml | head -n 1 | cut -d\" -f2)"
          tag_version="${RELEASE_TAG#v}"
          if [[ "$package_version" != "$tag_version" ]]; then
            echo "Cargo.toml version ($package_version) does not match tag ($tag_version)."
            exit 1
          fi

      - name: Read manually maintained release notes from RELEASE-NOTES.md
        id: release_metadata
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prep_build_matrix.outputs.ref }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          release_notes="${RUNNER_TEMP}/release-notes.md"
          bash .github/scripts/extract-release-notes.sh RELEASE-NOTES.md "$version" "$release_notes"

      - name: Create or refresh draft GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.prep_build_matrix.outputs.ref }}
          RELEASE_NAME: ${{ steps.release_metadata.outputs.release_name }}
          RELEASE_NOTES: ${{ runner.temp }}/release-notes.md
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists; refreshing its title and notes."
            gh release edit "$TAG_NAME" --title "$RELEASE_NAME" --notes-file "$RELEASE_NOTES" --repo "$GITHUB_REPOSITORY"
          else
            echo "Creating draft release $TAG_NAME before platform builds start."
            gh release create "$TAG_NAME" --draft --title "$RELEASE_NAME" --notes-file "$RELEASE_NOTES" --repo "$GITHUB_REPOSITORY"
          fi

  build:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    needs: [prep_build_matrix, prepare_release]
    if: |
      always() &&
      needs.prep_build_matrix.result == 'success' &&
      (needs.prepare_release.result == 'success' || needs.prepare_release.result == 'skipped')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prep_build_matrix.outputs.matrix) }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.prep_build_matrix.outputs.ref }}

      - name: Verify release tag
        if: |
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
          (github.event_name == 'workflow_dispatch' && inputs.operation == 'release')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail

          tag_commit="$(git rev-list -n 1 "$RELEASE_TAG^{commit}")"
          if ! git branch -r --contains "$tag_commit" | grep -qE 'origin/main$'; then
            echo "Tag $RELEASE_TAG does not point to a commit contained in main."
            exit 1
          fi

      - name: Validate release version
        if: |
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
          (github.event_name == 'workflow_dispatch' && inputs.operation == 'release')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail

          case "$RELEASE_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "Release tags must use vMAJOR.MINOR.PATCH; got $RELEASE_TAG"
              exit 1
              ;;
          esac

          package_version="$(grep '^version = ' Cargo.toml | head -n 1 | cut -d\" -f2)"
          tag_version="${RELEASE_TAG#v}"

          if [ "$package_version" != "$tag_version" ]; then
            echo "Cargo.toml version ($package_version) does not match tag ($tag_version)."
            exit 1
          fi

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: stable
          cache: true

      - name: Generate third-party licenses
        uses: ./.github/actions/third-party-licenses

      - name: Configure Linux cross compiler
        if: matrix.platform == 'linux' && matrix.arch == 'aarch64'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Configure Windows build environment
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: ${{ matrix.arch == 'aarch64' && 'amd64_arm64' || 'amd64' }}

      - name: Build release binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BUILD_PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
          DEBUG_BUILD: ${{ inputs.debug_build }}
          OPERATION: ${{ inputs.operation }}
          EVER_UNFOLDING_SAGA_VERSION_SUFFIX: ${{ inputs.version_suffix }}
        run: |
          set -euo pipefail

          rustup target add "$TARGET"

          if [[ "$BUILD_PLATFORM" == "linux" && "$ARCH" == "aarch64" ]]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          fi

          if [[ "$BUILD_PLATFORM" == "windows" ]]; then
            case "$ARCH" in
              x86_64)
                linker="${VCToolsInstallDir}bin/HostX64/x64/link.exe"
                ;;
              aarch64)
                linker="${VCToolsInstallDir}bin/HostX64/arm64/link.exe"
                ;;
              *)
                echo "Unsupported Windows architecture: $ARCH"
                exit 1
                ;;
            esac

            if [[ ! -f "$linker" ]]; then
              echo "MSVC linker not found: $linker"
              exit 1
            fi

            target_env="${TARGET//-/_}"
            target_env="${target_env^^}"
            export "CARGO_TARGET_${target_env}_LINKER=$linker"
          fi


          cargo_args=(build --release --target "$TARGET")
          if [[ "$OPERATION" == "build" && "$DEBUG_BUILD" == "true" ]]; then
            cargo_args+=(--features bevy/debug)
            echo "Bevy ECS debug names enabled"
          fi

          cargo "${cargo_args[@]}"

      - name: Package release archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BUILD_PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
          ARCHIVE_EXT: ${{ matrix.archive_ext }}
        run: |
          set -euo pipefail

          ref_name="${{ needs.prep_build_matrix.outputs.ref }}"
          ref_name="${ref_name//\//-}"
          release_name="teus-${ref_name}-${BUILD_PLATFORM}-${ARCH}"
          package_dir="package/$release_name"
          mkdir -p "$package_dir"

          cp -R data "$package_dir/"

          # Legal notices must travel with every binary and with data/.
          cp LICENSE LICENSE-CONTENT NOTICE THIRD-PARTY-NOTICES TRADEMARKS.md \
            THIRD-PARTY-LICENSES.txt "$package_dir/"
          mkdir -p "$package_dir/LICENSES"
          cp LICENSES/* "$package_dir/LICENSES/"
          cp LICENSE-CONTENT "$package_dir/data/LICENSE-CONTENT"

          if [[ "$BUILD_PLATFORM" == "windows" ]]; then
            cp "target/$TARGET/release/ever_unfolding_saga.exe" "$package_dir/"
            (cd package && 7z a -tzip -mx=9 "../$release_name.$ARCHIVE_EXT" "$release_name")
          else
            cp "target/$TARGET/release/ever_unfolding_saga" "$package_dir/"
            tar -cJf "$release_name.$ARCHIVE_EXT" -C package "$release_name"
          fi

          echo "Created $release_name.$ARCHIVE_EXT"

      - name: Upload release archive
        uses: actions/upload-artifact@v7.0.1
        with:
          # archive: false uses the single file's own name as the artifact name.
          path: teus-*-${{ matrix.platform }}-${{ matrix.arch }}*.${{ matrix.archive_ext }}
          if-no-files-found: error
          retention-days: 7
          archive: false
          overwrite: true

  release:
    name: Publish GitHub Release
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.operation == 'release')
    needs: [prep_build_matrix, build, prepare_release]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout release source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prep_build_matrix.outputs.ref }}
          fetch-depth: 0

      - name: Download release archives
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: teus-*
          path: dist
          merge-multiple: true
          skip-decompress: true

      - name: List downloaded archives
        shell: bash
        run: ls -R dist/

      - name: Upload desktop archives to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.prep_build_matrix.outputs.ref }}
        run: |
          set -euo pipefail
          gh release upload "$TAG_NAME" dist/teus-"$TAG_NAME"-linux-x86_64.tar.xz dist/teus-"$TAG_NAME"-linux-aarch64.tar.xz dist/teus-"$TAG_NAME"-macos-aarch64.tar.xz dist/teus-"$TAG_NAME"-windows-x86_64.zip dist/teus-"$TAG_NAME"-windows-aarch64.zip --clobber --repo "$GITHUB_REPOSITORY"

      - name: Verify complete desktop and Android asset set
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.prep_build_matrix.outputs.ref }}
        run: |
          set -euo pipefail
          expected_assets=(
            "teus-$TAG_NAME-linux-x86_64.tar.xz"
            "teus-$TAG_NAME-linux-aarch64.tar.xz"
            "teus-$TAG_NAME-macos-aarch64.tar.xz"
            "teus-$TAG_NAME-windows-x86_64.zip"
            "teus-$TAG_NAME-windows-aarch64.zip"
            "teus-$TAG_NAME-android-x86_64.apk"
            "teus-$TAG_NAME-android-aarch64.apk"
            "teus-$TAG_NAME-android-armv7.apk"
          )
          missing=()
          for attempt in {1..60}; do
            release_assets="$(gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null || true)"
            missing=()
            for asset in "${expected_assets[@]}"; do
              if ! grep -Fxq -- "$asset" <<< "$release_assets"; then
                missing+=("$asset")
              fi
            done
            if [[ "${#missing[@]}" -eq 0 ]]; then
              echo "All eight desktop and Android assets are present."
              break
            fi
            echo "Waiting for Android release assets (attempt $attempt/60): ${missing[*]}"
            sleep 30
          done
          if [[ "${#missing[@]}" -ne 0 ]]; then
            printf 'Cannot publish an incomplete release; missing assets:\n'
            printf '  %s\n' "${missing[@]}"
            exit 1
          fi

      - name: Publish complete GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.prep_build_matrix.outputs.ref }}
        run: |
          set -euo pipefail
          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG_NAME" --jq '.id')"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" -F draft=false -F make_latest=true
          echo "Published $TAG_NAME after verifying all eight release assets."


  publish_existing:
    name: Publish existing release artifacts
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Find complete desktop and Android artifact runs
        id: artifact_runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH; got $TAG_NAME"
            exit 1
          fi

          tag_commit="$(git rev-list -n 1 "$TAG_NAME^{commit}")"
          if [[ -z "$tag_commit" ]]; then
            echo "Could not resolve release tag $TAG_NAME."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "Tag $TAG_NAME does not point to a commit contained in main."
            exit 1
          fi

          package_version="$(grep '^version = ' Cargo.toml | head -n 1 | cut -d\" -f2)"
          tag_version="$(printf '%s' "$TAG_NAME" | sed 's/^v//')"
          if [[ "$package_version" != "$tag_version" ]]; then
            echo "Cargo.toml version ($package_version) does not match tag ($TAG_NAME)."
            exit 1
          fi

          expected_desktop=(
            "teus-$TAG_NAME-linux-x86_64.tar.xz"
            "teus-$TAG_NAME-linux-aarch64.tar.xz"
            "teus-$TAG_NAME-macos-aarch64.tar.xz"
            "teus-$TAG_NAME-windows-x86_64.zip"
            "teus-$TAG_NAME-windows-aarch64.zip"
          )
          expected_android=(
            "teus-$TAG_NAME-android-x86_64.apk"
            "teus-$TAG_NAME-android-aarch64.apk"
            "teus-$TAG_NAME-android-armv7.apk"
          )

          find_artifact_run() {
            local workflow_file="$1"
            shift
            local expected_names=("$@")
            local run_ids
            local run_id
            local available_names
            local expected
            local complete

            run_ids="$(gh api --paginate \
              "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_file/runs?event=push&per_page=100" \
              | jq -r --arg sha "$tag_commit" \
                '.workflow_runs[] | select(.head_sha == $sha and .status == "completed" and .conclusion == "success") | .id')"

            while IFS= read -r run_id; do
              [[ -n "$run_id" ]] || continue
              available_names="$(gh api \
                "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" \
                --jq '.artifacts[] | select(.expired == false) | .name')"

              complete=true
              for expected in "${expected_names[@]}"; do
                if ! grep -Fxq -- "$expected" <<< "$available_names"; then
                  complete=false
                  break
                fi
              done

              if [[ "$complete" == "true" ]]; then
                echo "$run_id"
                return 0
              fi
            done <<< "$run_ids"

            return 1
          }

          if ! desktop_run_id="$(find_artifact_run ci-cd.yml "${expected_desktop[@]}")"; then
            echo "::error::No completed CI/CD tag run for $TAG_NAME contains all five unexpired desktop artifacts."
            exit 1
          fi
          if ! android_run_id="$(find_artifact_run android-build.yml "${expected_android[@]}")"; then
            echo "::error::No completed Android tag run for $TAG_NAME contains all three unexpired APK artifacts."
            exit 1
          fi

          echo "desktop_run_id=$desktop_run_id" >> "$GITHUB_OUTPUT"
          echo "android_run_id=$android_run_id" >> "$GITHUB_OUTPUT"
          echo "Using desktop run $desktop_run_id and Android run $android_run_id for $TAG_NAME."

      - name: Download existing desktop archives
        uses: actions/download-artifact@v8.0.1
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.artifact_runs.outputs.desktop_run_id }}
          pattern: teus-${{ inputs.release_tag }}-*
          path: dist
          merge-multiple: true
          skip-decompress: true

      - name: Download existing Android APKs
        uses: actions/download-artifact@v8.0.1
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.artifact_runs.outputs.android_run_id }}
          pattern: teus-${{ inputs.release_tag }}-android-*.apk
          path: dist
          merge-multiple: true

      - name: Verify all eight downloaded artifacts
        shell: bash
        env:
          TAG_NAME: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          expected_assets=(
            "teus-$TAG_NAME-linux-x86_64.tar.xz"
            "teus-$TAG_NAME-linux-aarch64.tar.xz"
            "teus-$TAG_NAME-macos-aarch64.tar.xz"
            "teus-$TAG_NAME-windows-x86_64.zip"
            "teus-$TAG_NAME-windows-aarch64.zip"
            "teus-$TAG_NAME-android-x86_64.apk"
            "teus-$TAG_NAME-android-aarch64.apk"
            "teus-$TAG_NAME-android-armv7.apk"
          )

          for asset in "${expected_assets[@]}"; do
            if [[ ! -s "dist/$asset" ]]; then
              echo "::error::Downloaded release artifact is missing or empty: $asset"
              exit 1
            fi
          done

          echo "Verified all five desktop archives and all three Android APKs."
          ls -lh dist/


      - name: Upload artifacts to GitHub Release
        if: inputs.publish_to == 'github' || inputs.publish_to == 'both'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          if ! gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::GitHub Release $TAG_NAME does not exist. Run the release build operation first or select itch-only publishing."
            exit 1
          fi

          gh release upload "$TAG_NAME" \
            "dist/teus-$TAG_NAME-linux-x86_64.tar.xz" \
            "dist/teus-$TAG_NAME-linux-aarch64.tar.xz" \
            "dist/teus-$TAG_NAME-macos-aarch64.tar.xz" \
            "dist/teus-$TAG_NAME-windows-x86_64.zip" \
            "dist/teus-$TAG_NAME-windows-aarch64.zip" \
            "dist/teus-$TAG_NAME-android-x86_64.apk" \
            "dist/teus-$TAG_NAME-android-aarch64.apk" \
            "dist/teus-$TAG_NAME-android-armv7.apk" \
            --clobber --repo "$GITHUB_REPOSITORY"

          release_assets="$(gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          for asset in \
            "teus-$TAG_NAME-linux-x86_64.tar.xz" \
            "teus-$TAG_NAME-linux-aarch64.tar.xz" \
            "teus-$TAG_NAME-macos-aarch64.tar.xz" \
            "teus-$TAG_NAME-windows-x86_64.zip" \
            "teus-$TAG_NAME-windows-aarch64.zip" \
            "teus-$TAG_NAME-android-x86_64.apk" \
            "teus-$TAG_NAME-android-aarch64.apk" \
            "teus-$TAG_NAME-android-armv7.apk"; do
            if ! grep -Fxq -- "$asset" <<< "$release_assets"; then
              echo "::error::GitHub Release is missing uploaded asset $asset."
              exit 1
            fi
          done

          echo "All eight assets are attached to GitHub Release $TAG_NAME."
      - name: Validate itch.io publishing configuration
        if: inputs.publish_to == 'itch' || inputs.publish_to == 'both'
        id: itch_config
        shell: bash
        env:
          ITCHIO_TARGET: ${{ vars.ITCHIO_TARGET }}
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "$ITCHIO_TARGET" || -z "$BUTLER_API_KEY" ]]; then
            echo "::error::itch.io publishing requires the ITCHIO_TARGET repository variable and BUTLER_API_KEY secret."
            exit 1
          fi

          if [[ ! "$ITCHIO_TARGET" =~ ^[a-z0-9_-]+/[a-z0-9_-]+$ ]]; then
            echo "::error::ITCHIO_TARGET must use the lowercase username/game-slug format."
            exit 1
          fi

      - name: Install Butler
        if: inputs.publish_to == 'itch' || inputs.publish_to == 'both'
        shell: bash
        run: |
          set -euo pipefail

          archive="$RUNNER_TEMP/butler-linux-amd64.zip"
          install_dir="$RUNNER_TEMP/butler"
          mkdir -p "$install_dir"

          curl --fail --location --retry 3 \
            https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default \
            --output "$archive"
          unzip -q "$archive" -d "$install_dir"
          chmod +x "$install_dir/butler"
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/butler" version

      - name: Prepare desktop builds for Butler
        if: inputs.publish_to == 'itch' || inputs.publish_to == 'both'
        shell: bash
        env:
          TAG_NAME: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          build_root="$RUNNER_TEMP/itch-builds"
          mkdir -p "$build_root"

          for channel in linux-x86_64 linux-aarch64 macos-aarch64; do
            archive="dist/teus-$TAG_NAME-$channel.tar.xz"
            destination="$build_root/$channel"
            mkdir -p "$destination"
            tar -xJf "$archive" --strip-components=1 -C "$destination"

            if [[ ! -d "$destination/data" || ! -f "$destination/ever_unfolding_saga" ]]; then
              echo "Unexpected desktop package contents in $archive."
              exit 1
            fi
            chmod +x "$destination/ever_unfolding_saga"
          done

          for channel in windows-x86_64 windows-aarch64; do
            archive="dist/teus-$TAG_NAME-$channel.zip"
            archive_root="teus-$TAG_NAME-$channel"
            extract_dir="$RUNNER_TEMP/itch-extract-$channel"
            destination="$build_root/$channel"
            mkdir -p "$extract_dir" "$destination"
            unzip -q "$archive" -d "$extract_dir"

            if [[ ! -d "$extract_dir/$archive_root" ]]; then
              echo "Expected package directory not found in $archive."
              exit 1
            fi
            cp -a "$extract_dir/$archive_root/." "$destination/"

            if [[ ! -d "$destination/data" || ! -f "$destination/ever_unfolding_saga.exe" ]]; then
              echo "Unexpected desktop package contents in $archive."
              exit 1
            fi
          done

      - name: Publish all eight builds to itch.io
        if: inputs.publish_to == 'itch' || inputs.publish_to == 'both'
        shell: bash
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCHIO_TARGET: ${{ vars.ITCHIO_TARGET }}
          TAG_NAME: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          for channel in linux-x86_64 linux-aarch64 macos-aarch64 windows-x86_64 windows-aarch64; do
            echo "Publishing $channel"
            butler push "$RUNNER_TEMP/itch-builds/$channel" "$ITCHIO_TARGET:$channel" --userversion "$TAG_NAME"
          done

          for arch in x86_64 aarch64 armv7; do
            apk="dist/teus-$TAG_NAME-android-$arch.apk"
            channel="android-$arch"
            echo "Publishing $channel"
            butler push "$apk" "$ITCHIO_TARGET:$channel" --userversion "$TAG_NAME"
          done

      - name: Publish GitHub Release after selected destinations complete
        if: inputs.publish_to == 'github' || inputs.publish_to == 'both'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG_NAME" --jq '.id')"
          is_draft="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG_NAME" --jq '.draft')"
          if [[ "$is_draft" == "true" ]]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" -F draft=false
          fi
          echo "GitHub Release $TAG_NAME is published with the complete desktop and Android asset set."

  sync_lock:
    name: Commit Cargo.lock updates
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          token: ${{ secrets.SYNC_PUSH_TOKEN }}

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: stable
          cache: true

      - name: Sync lock file
        run: cargo update --workspace

      - name: Commit if changed
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already up to date."
            exit 0
          fi
          git config user.email "110196116+right-ward@users.noreply.github.com"
          git config user.name "right-ward"
          git add Cargo.lock
          git commit -m "chore: sync Cargo.lock [skip ci]"
          git push origin HEAD:main
