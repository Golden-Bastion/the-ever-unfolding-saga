name: Android APK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      action:
        description: Build or release
        required: true
        default: build
        type: choice
        options:
          - build
          - release
      source:
        description: Source branch
        required: true
        type: string
      target:
        description: Architecture
        required: false
        default: aarch64
        type: choice
        options:
          - x86_64
          - aarch64
          - armv7
      release:
        description: Existing release tag
        required: false
        type: string
      spatial_3d_prototype:
        description: Build the isolated 3D renderer prototype instead of the normal game (build action only)
        required: false
        default: false
        type: boolean
      version_suffix:
        description: Display-only suffix appended after the package version
        required: false
        default: ''
        type: string

concurrency:
  group: android-${{ github.ref }}-${{ inputs.action }}-${{ inputs.source }}-${{ inputs.target }}-${{ inputs.release }}-${{ inputs.version_suffix }}-${{ inputs.spatial_3d_prototype }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare Android build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      source_ref: ${{ steps.version.outputs.source_ref }}
      artifact_ref: ${{ steps.version.outputs.artifact_ref }}
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source || github.ref }}
          fetch-depth: 0

      - name: Validate release target
        if: |
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
          (github.event_name == 'workflow_dispatch' && inputs.action == 'release')
        shell: bash
        env:
          ACTION: ${{ inputs.action }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH; got $RELEASE_TAG"
            exit 1
          fi

          tag_commit="$(git rev-list -n 1 "$RELEASE_TAG^{commit}")"

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$ACTION" == "release" ]]; then
            if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "GitHub Release $RELEASE_TAG does not exist."
              exit 1
            fi

            if ! git merge-base --is-ancestor "$tag_commit" HEAD; then
              echo "Tag $RELEASE_TAG is not contained in source branch HEAD."
              exit 1
            fi
          else
            main_tip="$(git rev-parse origin/main^{commit})"
            if ! git merge-base --is-ancestor "$tag_commit" "$main_tip"; then
              echo "Tag $RELEASE_TAG does not point to a commit contained in main."
              exit 1
            fi
          fi

          package_version="$(grep '^version = ' Cargo.toml | head -n 1 | cut -d\" -f2)"
          tag_version="${RELEASE_TAG#v}"

          if [ "$package_version" != "$tag_version" ]; then
            echo "Cargo.toml version ($package_version) does not match tag $RELEASE_TAG."
            exit 1
          fi

      - name: Validate prototype build selection
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'release' && inputs.spatial_3d_prototype
        shell: bash
        run: |
          echo "The 3D prototype is a build-only APK and cannot be published as a normal release."
          exit 1

      - name: Resolve build version
        id: version
        shell: bash
        env:
          ACTION: ${{ inputs.action }}
          SOURCE_BRANCH: ${{ inputs.source }}
          RELEASE_TAG: ${{ inputs.release }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            source_ref="$GITHUB_REF_NAME"
            artifact_ref="$GITHUB_REF_NAME"
          elif [[ "$ACTION" == "release" ]]; then
            source_ref="$SOURCE_BRANCH"
            artifact_ref="$RELEASE_TAG"
          else
            source_ref="$SOURCE_BRANCH"
            artifact_ref="$SOURCE_BRANCH"
          fi

          version="$(grep '^version = ' Cargo.toml | head -n 1 | cut -d\" -f2)"
          if [[ -z "$version" ]]; then
            echo "Could not resolve Cargo.toml version from $source_ref."
            exit 1
          fi

          IFS=. read -r major minor patch <<< "$version"
          version_code=$((minor * 100000 + patch * 1000 + 1))

          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"
          echo "artifact_ref=$artifact_ref" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
      - name: Prepare matrix
        id: matrix
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
          ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail

          matrix='[
            {"target":"x86_64-linux-android","dispatch_target":"x86_64","arch":"x86_64","abi":"x86_64"},
            {"target":"aarch64-linux-android","dispatch_target":"aarch64","arch":"aarch64","abi":"arm64-v8a"},
            {"target":"armv7-linux-androideabi","dispatch_target":"armv7","arch":"armv7","abi":"armeabi-v7a"}
          ]'

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$ACTION" == "build" ]]; then
            matrix="$(jq -c --arg target "$TARGET" 'map(select(.dispatch_target == $target))' <<< "$matrix")"
            if [[ "$matrix" == "[]" ]]; then
              echo "Unsupported Android target: $TARGET"
              exit 1
            fi
          fi

          matrix="$(jq -c . <<< "$matrix")"
          echo "matrix={\"include\":$matrix}" >> "$GITHUB_OUTPUT"

  build:
    name: Android ${{ matrix.arch }} APK
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_ref }}
          fetch-depth: 0

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: stable
          cache: true

      - name: Generate third-party licenses
        uses: ./.github/actions/third-party-licenses

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.1
        with:
          packages: 'platform-tools platforms;android-34 build-tools;36.0.0'

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;28.2.13676358"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
          cache-overwrite-existing: true

      - name: Log Android packaging environment
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Android packaging CI diagnostics ==="
          echo "runner_os=$RUNNER_OS"
          echo "runner_arch=$RUNNER_ARCH"
          echo "java:"
          java -version 2>&1
          echo "gradle:"
          gradle --version
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358"
          echo "build-tools:"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2" version || true
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" 2>&1 | sed -n "1,2p" || true
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" version || true
          echo "AGP:"
          grep -n 'android-application' android/gradle/libs.versions.toml
          echo "Android packaging configuration:"
          grep -n -A6 -B2 'packaging' android/app/build.gradle || true
          grep -n -A12 -B2 'androidComponents' android/app/build.gradle || true

      - name: Prepare signing keystore
        shell: bash
        env:
          ACTION: ${{ inputs.action }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "push" || "$ACTION" == "release" ]]; then
            if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
              echo "Android release signing secrets are not configured."
              echo "Required: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD."
              exit 1
            fi

            keystore_file="$RUNNER_TEMP/ever-unfolding-saga-release.keystore"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_file"
          else
            if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" ]]; then
              keystore_file="$RUNNER_TEMP/ever-unfolding-saga-release.keystore"
              printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_file"
            else
              keystore_file="$RUNNER_TEMP/ever-unfolding-saga-ci.keystore"
              store_password="$(openssl rand -hex 24)"
              key_password="$(openssl rand -hex 24)"
              key_alias="ever-unfolding-saga-ci"
              keytool -genkeypair -noprompt \
                -keystore "$keystore_file" \
                -storepass "$store_password" \
                -keypass "$key_password" \
                -alias "$key_alias" \
                -keyalg RSA \
                -keysize 2048 \
                -validity 1 \
                -dname "CN=The Ever-Unfolding Saga CI,O=Right Ward,C=XX"

              echo "ANDROID_KEYSTORE_PASSWORD=$store_password" >> "$GITHUB_ENV"
              echo "ANDROID_KEY_ALIAS=$key_alias" >> "$GITHUB_ENV"
              echo "ANDROID_KEY_PASSWORD=$key_password" >> "$GITHUB_ENV"
            fi
          fi

          echo "ANDROID_KEYSTORE_FILE=$keystore_file" >> "$GITHUB_ENV"
          if [[ -n "$ANDROID_KEYSTORE_PASSWORD" ]]; then echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"; fi
          if [[ -n "$ANDROID_KEY_ALIAS" ]]; then echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"; fi
          if [[ -n "$ANDROID_KEY_PASSWORD" ]]; then echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"; fi

      - name: Build native Android library
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          SPATIAL_3D_PROTOTYPE: ${{ inputs.spatial_3d_prototype }}
          EVER_UNFOLDING_SAGA_VERSION_SUFFIX: ${{ inputs.version_suffix }}
        run: |
          set -o pipefail

          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/28.2.13676358"
          export PATH="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"

          case "$TARGET" in
            x86_64-linux-android)
              linker="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android24-clang"
              ;;
            aarch64-linux-android)
              linker="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
              ;;
            armv7-linux-androideabi)
              linker="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi24-clang"
              export CC_armv7_linux_androideabi="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi24-clang"
              export CXX_armv7_linux_androideabi="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi24-clang++"
              ;;
            *)
              echo "Unsupported Android target: $TARGET"
              exit 1
              ;;
          esac

          target_env="${TARGET//-/_}"
          target_env="${target_env^^}"
          export "CARGO_TARGET_${target_env}_LINKER=$linker"

          rustup target add "$TARGET"
          cargo_args=(build --release --target "$TARGET")
          if [[ "$SPATIAL_3D_PROTOTYPE" == "true" ]]; then
            cargo_args+=(--features spatial-3d-prototype)
            echo "Building the isolated 3D renderer prototype for Android"
          fi
          cargo "${cargo_args[@]}"

          so_file="target/$TARGET/release/libever_unfolding_saga.so"
          if [[ ! -s "$so_file" ]]; then
            echo "Android native library was not produced: $so_file"
            exit 1
          fi

          llvm_nm="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          readelf_bin="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"

          echo "=== llvm-nm -D (raw, unfiltered) ==="
          "$llvm_nm" -D "$so_file" || true

          echo "=== llvm-nm -D android_main search ==="
          "$llvm_nm" -D "$so_file" | grep -i android_main || echo "NO MATCH in -D output"

          echo "=== llvm-readelf -Ws android_main search ==="
          "$readelf_bin" -Ws "$so_file" | grep -i android_main || echo "NO MATCH in readelf -Ws"

          echo "=== existing android_main export gate ==="
          if ! "$llvm_nm" -D "$so_file" | grep -qE ' [Tt] android_main$'; then
            echo "libever_unfolding_saga.so does not export android_main; GameActivity cannot start it."
            exit 1
          fi

          mkdir -p "android/app/src/main/jniLibs/${{ matrix.abi }}"
          cp "$so_file" "android/app/src/main/jniLibs/${{ matrix.abi }}/libever_unfolding_saga.so"

          echo "=== Native library staged for Gradle ==="
          stat "$so_file" "android/app/src/main/jniLibs/${{ matrix.abi }}/libever_unfolding_saga.so"
          file "$so_file" "android/app/src/main/jniLibs/${{ matrix.abi }}/libever_unfolding_saga.so"
          sha256sum "$so_file" "android/app/src/main/jniLibs/${{ matrix.abi }}/libever_unfolding_saga.so"

      - name: Stage legal notices as APK assets
        shell: bash
        run: |
          set -euo pipefail
          legal_dir="android/app/src/main/assets/legal"
          mkdir -p "$legal_dir"
          cp LICENSE LICENSE-CONTENT NOTICE THIRD-PARTY-NOTICES TRADEMARKS.md \
            THIRD-PARTY-LICENSES.txt legal/ANDROID-DEPENDENCIES.txt "$legal_dir/"
          cp LICENSES/BUSL-1.1.txt "$legal_dir/"
          ls -l "$legal_dir"

      - name: Build signed APK
        shell: bash
        env:
          ANDROID_ABI: ${{ matrix.abi }}
          ANDROID_VERSION_NAME: ${{ needs.prepare.outputs.version }}
          ANDROID_VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
        working-directory: android
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/android-packaging-diagnostics.init.gradle" <<'EOF'
          allprojects { project ->
              project.plugins.withId("com.android.application") {
                  project.afterEvaluate {
                      def android = project.extensions.findByName("android")
                      if (android != null) {
                          try {
                              println "[CI][android-packaging] DSL jniLibs.useLegacyPackaging=${android.packaging.jniLibs.useLegacyPackaging}"
                          } catch (Exception e) {
                              println "[CI][android-packaging] Could not read DSL jniLibs.useLegacyPackaging: ${e.class.simpleName}: ${e.message}"
                          }
                      }
                  }

                  def components = project.extensions.findByName("androidComponents")
                  if (components == null) {
                      println "[CI][android-packaging] androidComponents extension not found"
                  } else {
                      println "[CI][android-packaging] androidComponents extension found"
                      components.onVariants(components.selector().withBuildType("release")) { variant ->
                          try {
                              def property = variant.packaging.jniLibs.useLegacyPackaging
                              println "[CI][android-packaging] variant=${variant.name} JniLibsApkPackaging.useLegacyPackaging present=${property.isPresent()} value=${property.isPresent() ? property.get() : '<unset>'}"
                          } catch (Exception e) {
                              println "[CI][android-packaging] Could not read release variant JNI packaging property: ${e.class.simpleName}: ${e.message}"
                          }
                      }
                  }
              }
          }
          EOF

          gradle --no-daemon --stacktrace --info --warning-mode all --console=plain             --init-script "$RUNNER_TEMP/android-packaging-diagnostics.init.gradle"             :app:assembleRelease

          apk="app/build/outputs/apk/release/app-release.apk"
          if [[ ! -f "$apk" ]]; then
            echo "Expected APK not found: $apk"
            exit 1
          fi

          safe_ref="${{ needs.prepare.outputs.artifact_ref }}"
          safe_ref="${safe_ref//\//-}"
          variant_suffix=""
          if [[ "${{ inputs.spatial_3d_prototype }}" == "true" ]]; then
            variant_suffix="-spatial-3d-prototype"
          fi
          apk_name="teus-${safe_ref}-android-${{ matrix.arch }}${variant_suffix}.apk"
          cp "$apk" "../$apk_name"
          echo "APK_NAME=$apk_name" >> "$GITHUB_ENV"
          echo "Created $apk_name"

      - name: Inspect Gradle APK packaging output
        working-directory: android
        shell: bash
        env:
          APK_NAME: ${{ env.APK_NAME }}
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"

          {
            echo "=== Gradle native-library intermediates ==="
            find app/build/intermediates -type f -name 'libever_unfolding_saga.so' -printf '%s bytes %p\n' | sort -n || true

            echo "=== APK metadata ==="
            stat "$apk"
            sha256sum "$apk"

            echo "=== APK native-library ZIP entries ==="
            unzip -lv "$apk" | grep -E 'lib/.+\.so$' || true

            echo "=== APK native-library ZIP details ==="
            python - "$apk" <<'PY'
          import sys
          from zipfile import ZipFile

          apk = sys.argv[1]
          with ZipFile(apk) as archive:
              native_libs = [
                  info for info in archive.infolist()
                  if info.filename.startswith("lib/") and info.filename.endswith(".so")
              ]
              for info in native_libs:
                  ratio = 100 * (1 - info.compress_size / info.file_size) if info.file_size else 0
                  print(
                      f"{info.filename}: method={info.compress_type} "
                      f"raw={info.file_size} compressed={info.compress_size} "
                      f"savings={ratio:.1f}% offset={info.header_offset}"
                  )
          PY

            echo "=== Largest APK entries ==="
            unzip -l "$apk" | awk 'NR > 3 {size=$1; name=$4; if (size ~ /^[0-9]+$/) print size, name}' | sort -nr | sed -n "1,20p"
          }

      - name: Verify native library compression
        shell: bash
        env:
          APK_NAME: ${{ env.APK_NAME }}
        run: |
          set -euo pipefail
          python - "$APK_NAME" <<'PY'
          import sys
          from zipfile import ZIP_STORED, ZipFile

          apk = sys.argv[1]
          with ZipFile(apk) as archive:
              native_libs = [
                  info for info in archive.infolist()
                  if info.filename.startswith("lib/") and info.filename.endswith(".so")
              ]

          if not native_libs:
              raise SystemExit("No native libraries found in APK.")

          failed = False
          for info in native_libs:
              compressed = info.compress_type != ZIP_STORED
              ratio = 100 * (1 - info.compress_size / info.file_size) if info.file_size else 0
              print(
                  f"{info.filename}: method={info.compress_type} "
                  f"raw={info.file_size} compressed={info.compress_size} "
                  f"savings={ratio:.1f}%"
              )
              if not compressed:
                  print(
                      f"Native library is stored uncompressed in APK: {info.filename}",
                      file=sys.stderr,
                  )
                  failed = True

          if failed:
              raise SystemExit(1)
          PY

      - name: Verify APK signature
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose "../$APK_NAME"

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}
          if-no-files-found: error
          retention-days: 7
          archive: false
          overwrite: true

  publish:
    name: Publish Android APKs
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'release')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Download Android APK artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: teus-*-android-*.apk
          path: dist
          merge-multiple: true

      - name: Publish APKs and remove legacy Android archives
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.release || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..60}; do
            if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload "$TAG_NAME" dist/*.apk --clobber --repo "$GITHUB_REPOSITORY"
              break
            fi
            echo "Release $TAG_NAME is not available yet; retrying ($attempt/60)."
            sleep 5
          done

          if ! gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Timed out waiting for GitHub Release $TAG_NAME."
            exit 1
          fi

      - name: Check itch.io publishing configuration
        id: itch_config
        shell: bash
        env:
          ITCHIO_TARGET: ${{ vars.ITCHIO_TARGET }}
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "$ITCHIO_TARGET" || -z "$BUTLER_API_KEY" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping itch.io publishing; configure the ITCHIO_TARGET repository variable and BUTLER_API_KEY repository secret to enable it."
            exit 0
          fi

          if [[ ! "$ITCHIO_TARGET" =~ ^[a-z0-9_-]+/[a-z0-9_-]+$ ]]; then
            echo "::error::ITCHIO_TARGET must use the lowercase username/game-slug format."
            exit 1
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Install Butler
        if: steps.itch_config.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail

          archive="$RUNNER_TEMP/butler-linux-amd64.zip"
          install_dir="$RUNNER_TEMP/butler"
          mkdir -p "$install_dir"

          curl --fail --location --retry 3 \
            https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default \
            --output "$archive"
          unzip -q "$archive" -d "$install_dir"
          chmod +x "$install_dir/butler"
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/butler" version

      - name: Wait for desktop release assets
        if: steps.itch_config.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.release || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          expected_assets=(
            "teus-$TAG_NAME-linux-x86_64.tar.xz"
            "teus-$TAG_NAME-linux-aarch64.tar.xz"
            "teus-$TAG_NAME-macos-aarch64.tar.xz"
            "teus-$TAG_NAME-windows-x86_64.zip"
            "teus-$TAG_NAME-windows-aarch64.zip"
            "teus-$TAG_NAME-android-x86_64.apk"
            "teus-$TAG_NAME-android-aarch64.apk"
            "teus-$TAG_NAME-android-armv7.apk"
          )

          missing=()
          for attempt in {1..120}; do
            release_assets="$(gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null || true)"
            missing=()
            for asset in "${expected_assets[@]}"; do
              if ! grep -Fxq -- "$asset" <<< "$release_assets"; then
                missing+=("$asset")
              fi
            done

            if [[ "${#missing[@]}" -eq 0 ]]; then
              echo "All desktop and Android release assets are available."
              break
            fi

            echo "Waiting for release assets (attempt $attempt/120): ${missing[*]}"
            sleep 30
          done

          if [[ "${#missing[@]}" -ne 0 ]]; then
            printf 'Timed out waiting for release assets:\n'
            printf '  %s\n' "${missing[@]}"
            exit 1
          fi

          mkdir -p dist
          rm -f dist/*.apk
          gh release download "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --dir dist \
            --pattern 'teus-*'

          for asset in "${expected_assets[@]}"; do
            if [[ ! -s "dist/$asset" ]]; then
              echo "Downloaded release asset is missing or empty: $asset"
              exit 1
            fi
          done

      - name: Prepare desktop builds for Butler
        if: steps.itch_config.outputs.enabled == 'true'
        env:
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.release || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          build_root="$RUNNER_TEMP/itch-builds"
          mkdir -p "$build_root"

          for channel in linux-x86_64 linux-aarch64 macos-aarch64; do
            archive="dist/teus-$TAG_NAME-$channel.tar.xz"
            destination="$build_root/$channel"
            mkdir -p "$destination"
            tar -xJf "$archive" --strip-components=1 -C "$destination"

            if [[ ! -d "$destination/data" || ! -f "$destination/ever_unfolding_saga" ]]; then
              echo "Unexpected desktop package contents in $archive."
              exit 1
            fi
            chmod +x "$destination/ever_unfolding_saga"
          done

          for channel in windows-x86_64 windows-aarch64; do
            archive="dist/teus-$TAG_NAME-$channel.zip"
            archive_root="teus-$TAG_NAME-$channel"
            extract_dir="$RUNNER_TEMP/itch-extract-$channel"
            destination="$build_root/$channel"
            mkdir -p "$extract_dir" "$destination"
            unzip -q "$archive" -d "$extract_dir"

            if [[ ! -d "$extract_dir/$archive_root" ]]; then
              echo "Expected package directory not found in $archive."
              exit 1
            fi
            cp -a "$extract_dir/$archive_root/." "$destination/"

            if [[ ! -d "$destination/data" || ! -f "$destination/ever_unfolding_saga.exe" ]]; then
              echo "Unexpected desktop package contents in $archive."
              exit 1
            fi
          done

      - name: Publish all release builds to itch.io
        if: steps.itch_config.outputs.enabled == 'true'
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCHIO_TARGET: ${{ vars.ITCHIO_TARGET }}
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.release || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          for channel in linux-x86_64 linux-aarch64 macos-aarch64 windows-x86_64 windows-aarch64; do
            echo "Publishing $channel"
            butler push "$RUNNER_TEMP/itch-builds/$channel" "$ITCHIO_TARGET:$channel" --userversion "$TAG_NAME"
          done

          for arch in x86_64 aarch64 armv7; do
            apk="dist/teus-$TAG_NAME-android-$arch.apk"
            channel="android-$arch"
            echo "Publishing $channel"
            butler push "$apk" "$ITCHIO_TARGET:$channel" --userversion "$TAG_NAME"
          done


